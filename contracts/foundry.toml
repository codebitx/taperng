[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.bls]
evm_version = "osaka"

[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
