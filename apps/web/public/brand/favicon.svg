<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="card"><rect width="256" height="256" rx="56"/></clipPath>
    <clipPath id="ring"><circle cx="128" cy="128" r="58"/></clipPath>
    <radialGradient id="bg" cx="28%" cy="14%" r="100%">
      <stop offset="0" stop-color="#173a54"/>
      <stop offset="52%" stop-color="#0b1925"/>
      <stop offset="1" stop-color="#050c13"/>
    </radialGradient>
    <radialGradient id="bloomA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35e0b0" stop-opacity=".20"/>
      <stop offset="1" stop-color="#35e0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#43a8ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#43a8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e0b0"/>
      <stop offset="1" stop-color="#43a8ff"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="256" height="256" rx="56" fill="url(#bg)"/>
    <circle cx="58" cy="44" r="118" fill="url(#bloomA)"/>
    <circle cx="214" cy="216" r="112" fill="url(#bloomB)"/>
  </g>

  <circle cx="128" cy="128" r="74" fill="none" stroke="url(#acc)" stroke-width="16"/>
  <g clip-path="url(#ring)">
    <path d="M58 118 H96 V92 H132 V156 H168 V118 H198"
          fill="none" stroke="url(#acc)" stroke-width="16"
          stroke-linecap="square" stroke-linejoin="round"/>
  </g>

  <circle cx="128" cy="54"  r="16" fill="#35e0b0"  stroke="#08131c" stroke-width="4"/>
  <circle cx="192" cy="166" r="16" fill="#43a8ff" stroke="#08131c" stroke-width="4"/>
  <circle cx="64"  cy="166" r="16" fill="#35e0b0"  stroke="#08131c" stroke-width="4"/>
</svg>